<div id="signupBox" class="hide"><h3 class="text-xl font-black">Create your account</h3><p class="text-xs text-slate-500 mt-1 mb-5">Let's make family assistance easier.</p><input id="signupName" placeholder="Full Name" class="w-full border border-[#cfe3dc] rounded-2xl px-4 py-3.5 mb-3"><input id="signupPhone" type="tel" placeholder="Mobile Number (+91)" class="w-full border border-[#cfe3dc] rounded-2xl px-4 py-3.5 mb-3"><div id="signupRecaptcha"></div><input id="signupOtp" inputmode="numeric" maxlength="6" placeholder="Enter OTP" class="hidden w-full border border-[#cfe3dc] rounded-2xl px-4 py-3.5 mb-3 outline-none focus:border-[#176b5b]"><button id="signupBtn" onclick="signup()" class="w-full bg-[#176b5b] text-white font-bold py-3.5 rounded-2xl">Get Started</button><p class="text-center text-xs text-slate-500 mt-5">Already have an account? <button onclick="toggleAuth(false)" class="text-[#176b5b] font-bold">Login</button></p></div>

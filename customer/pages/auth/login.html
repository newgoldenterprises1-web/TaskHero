<div id="loginBox"><h3 class="text-xl font-black">Welcome back 👋</h3><p class="text-xs text-slate-500 mt-1 mb-5">Sign in to manage your family's help.</p><input id="loginPhone" type="tel" placeholder="Mobile Number (+91)" class="w-full border border-[#cfe3dc] rounded-2xl px-4 py-3.5 mb-3 outline-none focus:border-[#176b5b]"><div id="loginRecaptcha"></div><input id="loginOtp" inputmode="numeric" maxlength="6" placeholder="Enter OTP" class="hidden w-full border border-[#cfe3dc] rounded-2xl px-4 py-3.5 mb-3 outline-none focus:border-[#176b5b]"><button id="loginBtn" onclick="login()" class="w-full bg-[#176b5b] text-white font-bold py-3.5 rounded-2xl">Continue</button><p class="text-center text-xs text-slate-500 mt-5">New here? <button onclick="toggleAuth(true)" class="text-[#176b5b] font-bold">Create account</button></p></div>

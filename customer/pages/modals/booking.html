<div id="bookingModal" class="modal fixed inset-0 z-50 bg-[#123c36]/40 backdrop-blur-sm p-4 items-center justify-center"><div class="bg-white rounded-3xl w-full max-w-lg p-6 max-h-[92vh] overflow-y-auto"><div class="flex justify-between"><div><h2 class="text-xl font-black">Book a Service</h2><p class="text-xs text-slate-500">Tell us where and when.</p></div><button onclick="closeBooking()" class="text-2xl">×</button></div><div id="bookingSummary" class="mt-4"></div><div class="space-y-3 mt-4"><label class="text-xs font-bold">Who needs help?</label><select id="forWho" onchange="updateFamilyOptions()" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"><option value="Me">Me</option><option value="Family">My Family</option></select><select id="familySelect" class="hide w-full border border-[#cfe3dc] rounded-xl px-3 py-3"></select><input id="bookingName" placeholder="Your Full Name" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"><input id="bookingPhone" placeholder="Mobile Number (+91)" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"><label class="text-xs font-bold">Service Address</label><select id="addressSelect" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"></select><input id="newAddress" placeholder="Or enter a new address / locality" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"><div class="grid grid-cols-2 gap-3"><input id="bookingDate" type="date" class="border border-[#cfe3dc] rounded-xl px-3 py-3"><select id="bookingTime" class="border border-[#cfe3dc] rounded-xl px-3 py-3"><option>10:00 AM - 12:00 PM</option><option>12:00 PM - 2:00 PM</option><option>2:00 PM - 4:00 PM</option><option>4:00 PM - 6:00 PM</option><option>6:00 PM - 8:00 PM</option></select></div><textarea id="instructions" rows="3" placeholder="Instructions for the partner (optional)" class="w-full border border-[#cfe3dc] rounded-xl px-3 py-3"></textarea><label class="text-xs font-bold">Add photos (optional)</label><input id="photos" type="file" accept="image/*" multiple class="w-full text-xs"></div><div class="mt-5 bg-[#f7fcfa] rounded-2xl p-4"><div class="flex justify-between text-sm"><span>Service</span><b id="sumService"></b></div><div class="flex justify-between text-sm mt-2"><span>Estimated service fee</span><b id="sumPrice"></b></div><div class="border-t border-[#dcefe7] mt-3 pt-3 flex justify-between"><b>Total</b><b id="sumTotal" class="text-[#176b5b] text-lg"></b></div></div><button onclick="confirmBooking()" class="w-full mt-4 bg-[#176b5b] text-white font-black py-3.5 rounded-2xl">Confirm Request</button><p class="text-[10px] text-center text-slate-500 mt-2">Payment is intentionally not connected yet.</p></div></div>

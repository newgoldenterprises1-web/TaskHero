<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Near Family — Admin Control Center</title>
<script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#f4faf7] text-[#123c36] min-h-screen font-sans">
<header class="sticky top-0 z-40 bg-white/95 backdrop-blur border-b border-[#dcefe7] px-5 py-4 flex justify-between items-center shadow-sm">
 <div class="flex items-center gap-3"><div class="w-10 h-10 rounded-xl bg-[#176b5b] text-white flex items-center justify-center font-black text-xl">♥</div><div><h1 class="text-xl font-black">Near <span class="text-[#176b5b]">Family</span> Control Center</h1><p class="text-[10px] text-[#638079] font-bold tracking-wider">CUSTOMER BOOKINGS & PARTNER DISPATCH</p></div></div>
 <button onclick="fetchBookings()" class="bg-[#176b5b] text-white font-bold px-4 py-2.5 rounded-xl text-xs">↻ Refresh Bookings</button>
</header>
<main class="max-w-7xl mx-auto px-4 py-7 space-y-7">
 <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
  <div class="bg-white border border-[#dcefe7] rounded-2xl p-5"><p class="text-slate-500 text-xs font-semibold">Total Bookings</p><h3 id="statTotal" class="text-3xl font-black mt-1">0</h3></div>
  <div class="bg-white border border-[#dcefe7] rounded-2xl p-5"><p class="text-slate-500 text-xs font-semibold">Gross Revenue</p><h3 id="statRevenue" class="text-3xl font-black text-[#176b5b] mt-1">₹0</h3></div>
  <div class="bg-white border border-[#dcefe7] rounded-2xl p-5"><p class="text-slate-500 text-xs font-semibold">Platform Cut (20%)</p><h3 id="statCommission" class="text-3xl font-black text-[#b98522] mt-1">₹0</h3></div>
  <div class="bg-white border border-[#dcefe7] rounded-2xl p-5"><p class="text-slate-500 text-xs font-semibold">Active Assistance</p><h3 id="statActive" class="text-3xl font-black text-sky-600 mt-1">0</h3></div>
 </div>
 <section class="bg-white border border-[#dcefe7] rounded-3xl overflow-hidden">
  <div class="p-5 border-b border-[#dcefe7] flex justify-between items-center"><h2 class="font-black">♥ Live Customer Bookings</h2><span class="text-[10px] bg-emerald-50 text-emerald-700 border border-emerald-200 px-3 py-1 rounded-full font-bold">LIVE DATABASE</span></div>
  <div class="overflow-x-auto"><table class="w-full text-left text-xs"><thead class="bg-[#f4faf7] text-slate-500 uppercase text-[10px]"><tr><th class="p-4">Booking</th><th class="p-4">Customer</th><th class="p-4">Service</th><th class="p-4">Location</th><th class="p-4">Amount</th><th class="p-4">Status</th><th class="p-4">Action</th></tr></thead><tbody id="bookingsTableBody"><tr><td colspan="7" class="p-10 text-center text-slate-500">Loading Near Family bookings...</td></tr></tbody></table></div>
 </section>
</main>
<script>
const SUPABASE_URL='https://jfmkranbxqvwzkgbevhh.supabase.co';const SUPABASE_KEY='sb_publishable_8_bg-feg0S6m2GvV30E0ZQ_hpBWEeXU';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function fetchBookings(){const tbody=document.getElementById('bookingsTableBody');tbody.innerHTML='<tr><td colspan="7" class="p-10 text-center text-slate-500">Fetching latest bookings...</td></tr>';try{const {data,error}=await supabaseClient.from('bookings').select('*').order('id',{ascending:false});if(error)throw error;if(!data?.length){tbody.innerHTML='<tr><td colspan="7" class="p-10 text-center text-slate-500">No bookings found yet.</td></tr>';updateStats([]);return}updateStats(data);tbody.innerHTML='';data.forEach(order=>{const service=order.service_title||order.service_name||'Near Family Assistance';const amount=order.total_amount??order.amount??0;const phone=order.customer_phone||order.phone||'';const row=document.createElement('tr');row.className='border-t border-[#edf5f1] hover:bg-[#f7fcfa]';row.innerHTML=`<td class="p-4 font-mono font-bold text-[#176b5b]">${order.booking_code||('NF-'+order.id)}</td><td class="p-4"><div class="font-bold">${order.customer_name||'N/A'}</div><div class="text-[11px] text-slate-400">${phone}</div></td><td class="p-4 font-medium">${service}</td><td class="p-4"><div class="font-semibold">${order.area||''}</div><div class="text-[10px] text-slate-500 max-w-[180px] truncate">${order.address||''}</div></td><td class="p-4 font-black text-[#176b5b]">₹${amount}</td><td class="p-4"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold border ${getStatusStyle(order.status)}">${order.status||'Pending'}</span></td><td class="p-4"><select onchange="updateOrderStatus('${order.id}',this.value)" class="bg-white border border-[#cfe3dc] text-[11px] rounded-lg px-2 py-1"><option value="">Update...</option><option>Partner Assigned</option><option>Partner En Route</option><option>Arrived</option><option>Service Started</option><option>Completed</option><option>Cancelled</option></select></td>`;tbody.appendChild(row)})}catch(e){console.error(e);tbody.innerHTML='<tr><td colspan="7" class="p-10 text-center text-red-500">Could not load bookings. Check Supabase RLS/schema.</td></tr>'}}
function getStatusStyle(s){if(!s)return'bg-slate-50 text-slate-500 border-slate-200';if(s==='Completed')return'bg-emerald-50 text-emerald-700 border-emerald-200';if(s==='Cancelled')return'bg-red-50 text-red-600 border-red-200';if(s.includes('En Route')||s.includes('Started')||s==='Arrived')return'bg-amber-50 text-amber-700 border-amber-200';return'bg-sky-50 text-sky-700 border-sky-200'}
function updateStats(data){const total=data.length,revenue=data.reduce((a,x)=>a+Number(x.total_amount??x.amount??0),0),active=data.filter(x=>x.status&&!['Completed','Cancelled'].includes(x.status)).length;document.getElementById('statTotal').innerText=total;document.getElementById('statRevenue').innerText='₹'+revenue;document.getElementById('statCommission').innerText='₹'+Math.round(revenue*.2);document.getElementById('statActive').innerText=active}
async function updateOrderStatus(id,status){if(!status)return;try{const {error}=await supabaseClient.from('bookings').update({status}).eq('id',id);if(error)throw error;fetchBookings()}catch(e){alert('Update failed: '+e.message)}}
fetchBookings();
</script>
</body></html>
